<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Tracker</title>
<meta name="description" content="Registro de entrenamientos con pesas.">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #f6f6f4;
  --surface: #ffffff;
  --surface-2: #efefec;
  --text: #16171a;
  --muted: #62646b;
  --line: #dedfdb;
  --primary: #16171a;
  --on-primary: #ffffff;
  --accent: #127a4b;
  --accent-soft: #e2f4ea;
  --warn: #8a5300;
  --warn-soft: #fdf0d8;
  --danger: #a3261d;
  --danger-soft: #fbe5e2;
  --focus: #2f6fed;
  --radius: 14px;
  --tabbar-h: 64px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111214;
    --surface: #1b1c1f;
    --surface-2: #26272b;
    --text: #f2f2f3;
    --muted: #a2a4ab;
    --line: #313237;
    --primary: #f2f2f3;
    --on-primary: #111214;
    --accent: #3dd68c;
    --accent-soft: #173327;
    --warn: #f3b650;
    --warn-soft: #362a14;
    --danger: #ff8a80;
    --danger-soft: #3a1c1a;
    --focus: #7aa5ff;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { max-width: 520px; margin: 0 auto; min-height: 100dvh; padding: 0 16px calc(var(--tabbar-h) + 84px + env(safe-area-inset-bottom)); }
.center { min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; gap: 20px; padding-bottom: 40px; }
h1 { font-size: 28px; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 20px; margin: 0; }
h3 { font-size: 16px; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.num { font-variant-numeric: tabular-nums; }

.btn {
  min-height: 52px; width: 100%; border-radius: 12px; border: 0;
  background: var(--primary); color: var(--on-primary); font-weight: 600; font-size: 17px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 0 18px;
}
.btn:disabled { opacity: .5; cursor: default; }
.btn-secondary { background: var(--surface-2); color: var(--text); }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn-link { background: none; border: 0; color: var(--muted); min-height: 44px; padding: 0 8px; text-decoration: underline; text-underline-offset: 3px; }
.btn-sm { min-height: 44px; width: auto; font-size: 15px; padding: 0 14px; border-radius: 10px; }

.field { width: 100%; min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-size: 18px; }

.choice { display: grid; gap: 12px; }
.card-choice {
  text-align: left; width: 100%; min-height: 84px; border-radius: var(--radius);
  border: 1.5px solid var(--line); background: var(--surface); padding: 16px;
}
.card-choice strong { display: block; font-size: 18px; }
.card-choice[aria-pressed="true"] { border-color: var(--text); }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.steps { display: flex; gap: 6px; }
.steps span { height: 4px; flex: 1; border-radius: 2px; background: var(--line); }
.steps span.on { background: var(--text); }

/* ---- Hoy */
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 12px; padding: calc(14px + env(safe-area-inset-top)) 0 12px; }
.top .title { flex: 1; min-width: 0; }
.top .title small { display: block; color: var(--muted); font-size: 14px; }
.top .title h1 { font-size: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.avatar { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-2); font-weight: 700; font-size: 15px; flex: none; }
.chip { display: inline-block; background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; }

.list { display: grid; gap: 10px; margin-top: 8px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 8px; }
.ex-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ex-name { flex: 1; min-width: 0; }
.ex-name strong { display: block; font-weight: 600; }
.ex-name span { color: var(--muted); font-size: 14px; }
.sets { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.badge { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-size: 12px; font-weight: 700; letter-spacing: .02em; flex: none; color: var(--muted); }
.warn-band { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 10px; font-size: 14px; font-weight: 600; }
.danger-band { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 8px 10px; font-size: 14px; font-weight: 600; }

/* tabla de series */
.set-table { display: grid; gap: 6px; }
.set-head, .set-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) 104px 58px 44px; gap: 4px; align-items: center; }
.set-head { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.set-row { background: var(--surface-2); border-radius: 10px; padding: 6px; }
.set-row.done { background: var(--accent-soft); }
.set-row.pending { background: var(--warn-soft); }
.set-row .idx { text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.set-row .prev { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; text-align: center; }
.stepper { display: grid; grid-template-columns: 30px minmax(0, 1fr) 30px; align-items: center; gap: 2px; }
.stepper button { min-height: 44px; border: 0; background: transparent; font-size: 20px; font-weight: 600; border-radius: 8px; }
.num-input { width: 100%; min-height: 44px; text-align: center; border: 0; border-radius: 8px; background: var(--surface); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 0 2px; }
.check { min-height: 44px; width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; }
.check[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.set-row.pending .check { border-color: var(--warn); color: var(--warn); }

.rest-timer { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 12px; padding: 8px 10px; }
.rest-timer .t { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 68px; }

.next-list { display: grid; gap: 2px; margin-top: 10px; }
.next-row { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 2px; min-height: 52px; text-align: left; }
.next-row:last-child { border-bottom: 0; }
.next-row .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: 13px; }
.next-row .dot.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.next-row[aria-current="true"] strong { text-decoration: underline; text-underline-offset: 3px; }

.rest { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 18px; display: grid; gap: 14px; margin-top: 12px; }
.note { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--muted); margin-top: 14px; }
.inline-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; gap: 8px; }

.finish-bar { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); z-index: 9; padding: 10px 16px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
.finish-bar .inner { max-width: 520px; margin: 0 auto; }

/* ---- resumen / progreso */
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.metric { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; text-align: center; }
.metric strong { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.metric span { font-size: 13px; color: var(--muted); }
.record { background: var(--accent-soft); border-radius: var(--radius); padding: 14px; display: grid; gap: 4px; }
.record strong { color: var(--accent); }
.big-check { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); color: var(--bg); display: grid; place-items: center; font-size: 36px; margin: 0 auto; }
.chart { width: 100%; height: 190px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.trend-up { color: var(--accent); }
.trend-down { color: var(--danger); }

/* ---- Ejercicios */
.search { position: sticky; top: calc(66px + env(safe-area-inset-top)); z-index: 4; background: var(--bg); padding-bottom: 8px; }
.group-title { margin: 20px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.cat-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); min-height: 52px; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.tag { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
.tag.partial { background: var(--warn-soft); color: var(--warn); }
.tag.forbidden { background: var(--danger-soft); color: var(--danger); }
.tag.plain { background: var(--surface-2); color: var(--muted); }
.empty { text-align: center; padding: 48px 12px; display: grid; gap: 16px; }

/* ---- Tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar nav { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabbar-h); }
.tabbar button { background: none; border: 0; display: grid; place-items: center; align-content: center; gap: 2px; color: var(--muted); font-size: 13px; font-weight: 600; }
.tabbar button[aria-current="page"] { color: var(--text); }
.tabbar svg { width: 24px; height: 24px; }

/* ---- Hoja inferior */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 85dvh; overflow: auto;
  background: var(--surface); border-radius: 18px 18px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
}
.sheet-inner { max-width: 520px; margin: 0 auto; display: grid; gap: 12px; }
.grabber { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 6px; }
.sheet-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--line); }
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.seg button { min-height: 40px; min-width: 64px; border: 0; border-radius: 8px; background: transparent; font-weight: 600; font-size: 15px; padding: 0 10px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line); }

.toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom)); z-index: 30; max-width: 488px; margin: 0 auto; background: var(--text); color: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--text); animation: spin .8s linear infinite; margin: 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<div id="sheet-host"></div>

// ---- funciones puras
function sessionKeyForDay(routineKey, weekday) {
  return ROUTINES[routineKey]?.schedule[weekday] || null;
}

// Próxima sesión a partir de mañana: { weekday, key }
function nextSession(routineKey, weekday) {
  for (let i = 1; i <= 7; i++) {
    const d = (weekday + i) % 7;
    const key = sessionKeyForDay(routineKey, d);
    if (key) return { weekday: d, key };
  }
  return null;
}

function initials(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
}

// Nivel de aviso de rodilla para un usuario: null | 'partial' | 'forbidden'
function kneeWarning(exercise, kneeRestriction) {
  if (!kneeRestriction || !exercise || exercise.knee === 'none') return null;
  return exercise.knee;
}

function alternativesFor(exerciseId, kneeRestriction) {
  const base = EX[exerciseId];
  if (!base) return [];
  return EXERCISES.filter((e) => e.group === base.group && e.id !== base.id && !(kneeRestriction && e.knee === 'forbidden'));
}

function normalize(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

// '2x6-10' → 2 · '8x30s' → 8
function targetSets(spec) {
  const n = parseInt(String(spec), 10);
  return Number.isFinite(n) && n > 0 ? n : 1;
}

function round1(n) {
  return Math.round(Number(n) * 10) / 10;
}

function fmtKg(n) {
  const v = round1(n);
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}

function fmtDuration(sec) {
  const s = Math.max(0, Math.round(sec));
  if (s < 60) return 'menos de 1 min';
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  return h ? `${h} h ${m} min` : `${m} min`;
}

function mmss(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function volumeOf(sets) {
  return round1(sets.reduce((acc, s) => acc + (Number(s.weight_kg) || 0) * (Number(s.reps) || 0), 0));
}

// Mejor marca de un ejercicio: más peso; a igual peso, más reps.
function bestOf(sets) {
  let best = null;
  for (const s of sets) {
    if (!s.done || s.weight_kg == null || !s.reps) continue;
    if (!best || Number(s.weight_kg) > Number(best.weight_kg) ||
      (Number(s.weight_kg) === Number(best.weight_kg) && Number(s.reps) > Number(best.reps))) best = s;
  }
  return best;
}

function isBetter(set, best) {
  if (!set || set.weight_kg == null || !set.reps) return false;
  if (!best) return true;
  return Number(set.weight_kg) > Number(best.weight_kg) ||
    (Number(set.weight_kg) === Number(best.weight_kg) && Number(set.reps) > Number(best.reps));
}

// Lunes de la semana de una fecha, a medianoche local.
function weekStart(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d;
}

// Semanas seguidas (hasta la actual) con al menos `min` entrenos.
function streakWeeks(workouts, min, today = new Date()) {
  const counts = new Map();
  for (const w of workouts) {
    if (!w.finished_at) continue;
    counts.set(+weekStart(w.started_at || w.finished_at), (counts.get(+weekStart(w.started_at || w.finished_at)) || 0) + 1);
  }
  let streak = 0;
  const cursor = weekStart(today);
  // La semana en curso solo corta la racha si ya terminó.
  if ((counts.get(+cursor) || 0) >= min) streak++;
  for (let i = 1; i <= 104; i++) {
    const w = new Date(cursor);
    w.setDate(w.getDate() - 7 * i);
    if ((counts.get(+w) || 0) >= min) streak++;
    else break;
  }
  return streak;
}

function weekVolume(sets, offsetWeeks = 0, today = new Date()) {
  const start = weekStart(today);
  start.setDate(start.getDate() - 7 * offsetWeeks);
  const end = new Date(start);
  end.setDate(end.getDate() + 7);
  return volumeOf(sets.filter((s) => {
    const t = new Date(s.created_at);
    return t >= start && t < end;
  }));
}

function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
  });
}

// Cola de guardado: reintenta sola 3 veces con espera creciente.
const queue = new Map(); // id → { run, tries, timer }

function enqueue(id, run, onFail) {
  const item = queue.get(id) || { tries: 0 };
  item.run = run;
  item.onFail = onFail;
  queue.set(id, item);
  attempt(id);
}

async function attempt(id) {
  const item = queue.get(id);
  if (!item || item.busy) return;
  item.busy = true;
  const ran = item.run;
  try {
    await ran();
    item.busy = false;
    // Si mientras guardaba se pidió otra cosa sobre la misma serie (por ejemplo desmarcarla), va eso.
    if (item.run !== ran) { attempt(id); return; }
    queue.delete(id);
    markSaved(id);
  } catch (err) {
    item.busy = false;
    item.tries += 1;
    console.warn('guardado fallido', err);
    if (item.tries <= 3) {
      item.timer = setTimeout(() => attempt(id), 500 * 2 ** (item.tries - 1));
    } else {
      queue.delete(id);
      item.onFail?.();
    }
  }
}

function markSaved(id) {
  const c = state.current;
  if (!c) return;
  for (const rows of Object.values(c.sets)) {
    const row = rows.find((r) => r.id === id);
    if (row && row.status !== 'saved') { row.status = 'saved'; renderIfToday(); }
  }
}

function markFailed(id) {
  const c = state.current;
  if (!c) return;
  for (const rows of Object.values(c.sets)) {
    const row = rows.find((r) => r.id === id);
    if (row) { row.status = 'error'; renderIfToday(); }
  }
  toast('No se pudo guardar la serie. Revisá la conexión y tocá ✓ de nuevo.');
}

// ---- entreno en curso
function startWorkout(routineKey, dayKey) {
  const w = {
    id: uuid(),
    user_id: state.profile.id,
    routine: routineKey,
    day_key: dayKey,
    started_at: new Date().toISOString(),
  };
  // Mejores marcas previas, para detectar récords al terminar.
  const bests = {};
  for (const s of state.data.sets) {
    if (!s.done) continue;
    if (isBetter(s, bests[s.exercise_id])) bests[s.exercise_id] = s;
  }
  state.current = { workout: w, sets: {}, activeSlot: 0, restEndsAt: null, bests, saved: false };
  return state.current;
}

function rowsFor(slot) {
  const c = state.current;
  if (!c.sets[slot]) c.sets[slot] = [];
  return c.sets[slot];
}

// Última vez que hizo ese ejercicio: sets del entreno más reciente, por número de serie.
function previousFor(exerciseId) {
  const mine = state.data.sets
    .filter((s) => s.exercise_id === exerciseId && s.done && s.workout_id !== state.current?.workout.id)
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  if (!mine.length) return {};
  const lastWorkout = mine[0].workout_id;
  const out = {};
  for (const s of mine.filter((s) => s.workout_id === lastWorkout)) out[s.set_index] = s;
  return out;
}

function defaultsFor(slot, setIndex, exerciseId) {
  const touched = state.previewValues[`${slot}|${setIndex}`];
  if (touched) return { weight: touched.kg, reps: touched.reps };
  const rows = rowsFor(slot);
  const before = rows.filter((r) => r.set_index < setIndex).pop();
  if (before) return { weight: before.weight_kg, reps: before.reps };
  const prev = previousFor(exerciseId)[setIndex] || previousFor(exerciseId)[1];
  if (prev) return { weight: Number(prev.weight_kg), reps: Number(prev.reps) };
  return { weight: 0, reps: 8 };
}

function ensureRows(slot, exerciseId, target) {
  const rows = rowsFor(slot);
  for (let i = rows.length; i < target; i++) {
    const setIndex = i + 1;
    const d = defaultsFor(slot, setIndex, exerciseId);
    rows.push({
      id: uuid(), set_index: setIndex, exercise_id: exerciseId,
      weight_kg: d.weight, reps: d.reps, done: false, status: 'idle',
    });
  }
  return rows;
}

function saveSet(slot, row) {
  const c = state.current;
  const payload = {
    id: row.id,
    workout_id: c.workout.id,
    user_id: state.profile.id,
    exercise_id: row.exercise_id,
    slot_index: slot,
    set_index: row.set_index,
    weight_kg: row.weight_kg,
    reps: row.reps,
    done: true,
    created_at: row.created_at || new Date().toISOString(),
  };
  row.created_at = payload.created_at;
  row.status = 'pending';
  // Guardo también en memoria para que "Anterior", récords y progreso lo vean enseguida.
  state.data.sets = [payload, ...state.data.sets.filter((s) => s.id !== payload.id)];
  enqueue(row.id, async () => {
    if (!c.saved) { await db.upsertWorkout(c.workout); c.saved = true; }
    await db.upsertSet(payload);
  }, () => markFailed(row.id));
}

function unsaveSet(row) {
  state.data.sets = state.data.sets.filter((s) => s.id !== row.id);
  row.status = 'idle';
  enqueue(row.id, () => db.deleteSet(row.id), () => markFailed(row.id));
}

function currentSets() {
  return Object.values(state.current?.sets || {}).flat().filter((r) => r.done);
}

async function finishWorkout() {
  const c = state.current;
  if (!c) return;
  const done = currentSets();
  const finished = new Date();
  const started = new Date(c.workout.started_at);
  const workout = {
    ...c.workout,
    finished_at: finished.toISOString(),
    duration_sec: Math.max(1, Math.round((finished - started) / 1000)),
    total_volume_kg: volumeOf(done),
  };

  const records = [];
  for (const row of done) {
    const best = c.bests[row.exercise_id];
    // La primera vez que hacés un ejercicio no cuenta como récord.
    if (best && isBetter(row, best)) {
      records.push({ exercise_id: row.exercise_id, weight: row.weight_kg, reps: row.reps, before: best });
      c.bests[row.exercise_id] = row;
    }
  }

  state.data.workouts = [workout, ...state.data.workouts.filter((w) => w.id !== workout.id)];
  state.summary = {
    name: ROUTINES[workout.routine].sessions[workout.day_key].name,
    duration_sec: workout.duration_sec,
    volume: workout.total_volume_kg,
    sets: done.length,
    records,
  };
  state.current = null;
  state.previewValues = {};
  state.view = 'summary';
  render();

  enqueue(workout.id, () => db.upsertWorkout(workout), () => {
    toast('El entreno quedó guardado en el celular pero no se pudo cerrar en la nube. Se reintenta al volver a entrar.');
  });
}

// ---- timer de descanso
let tick = null;
function startRest() {
  state.current.restEndsAt = Date.now() + REST_SECONDS * 1000;
  ensureTick();
}
function ensureTick() {
  if (tick) return;
  tick = setInterval(() => {
    const c = state.current;
    if (!c || !c.restEndsAt) { clearInterval(tick); tick = null; return; }
    const left = Math.round((c.restEndsAt - Date.now()) / 1000);
    const el = document.getElementById('rest-left');
    if (el) el.textContent = mmss(Math.max(0, left));
    if (left <= 0) {
      c.restEndsAt = null;
      clearInterval(tick); tick = null;
      alarm();
      renderIfToday();
    }
  }, 500);
}
function alarm() {
  try { navigator.vibrate?.([200, 100, 200]); } catch { /* no todos los equipos vibran */ }
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 880;
    gain.gain.value = 0.2;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.25);
    setTimeout(() => ctx.close(), 600);
  } catch { /* sin audio disponible */ }
}

    <div class="inline-actions">

    </div>

  const rest = s.slots.map(([, sets], i) => {

  root.innerHTML = `${topBar(small, s.name, chip)}

  finishHost.innerHTML = c
    ? `<div class="finish-bar"><div class="inner"><button class="btn" data-action="finish">Finalizar entreno</button></div></div>`

function chartFor(exerciseId) {
  // Peso máximo por sesión, últimas 8 semanas.
  const since = new Date();
  since.setDate(since.getDate() - 56);
  const byWorkout = new Map();
  for (const s of state.data.sets) {
    if (s.exercise_id !== exerciseId || !s.done || new Date(s.created_at) < since) continue;
    const cur = byWorkout.get(s.workout_id);
    if (!cur || Number(s.weight_kg) > cur.w) byWorkout.set(s.workout_id, { w: Number(s.weight_kg), t: new Date(s.created_at) });
  }
  const points = [...byWorkout.values()].sort((a, b) => a.t - b.t);
  if (points.length < 2) return '<p class="muted small">Necesitás al menos dos sesiones con este ejercicio para ver la curva.</p>';

  const W = 320, H = 150, pad = 26;
  const xs = points.map((p) => +p.t);
  const ys = points.map((p) => p.w);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const spanY = maxY - minY || 1;
  const px = (x) => pad + ((x - minX) / (maxX - minX || 1)) * (W - pad * 2);
  const py = (y) => H - pad - ((y - minY) / spanY) * (H - pad * 2);
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${px(+p.t).toFixed(1)} ${py(p.w).toFixed(1)}`).join(' ');
  const dots = points.map((p) => `<circle cx="${px(+p.t).toFixed(1)}" cy="${py(p.w).toFixed(1)}" r="3.5" fill="currentColor"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Peso máximo por sesión: de ${fmtKg(ys[0])} a ${fmtKg(ys[ys.length - 1])} kilos" style="color:var(--accent)">
    <path d="${d}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="4" y="${py(maxY) + 4}" font-size="10" fill="var(--muted)">${fmtKg(maxY)}</text>
    <text x="4" y="${py(minY) + 4}" font-size="10" fill="var(--muted)">${fmtKg(minY)}</text>
  </svg>`;
}

function renderProgress() {
  finishHost.innerHTML = '';
  const done = state.data.sets.filter((s) => s.done);
  if (!done.length) {
    root.innerHTML = `${topBar('Tu evolución', 'Progreso')}
      <div class="empty">
        <p class="muted">Todavía no registraste nada. Arrancá con tu primera serie.</p>
        <button class="btn btn-secondary" data-action="tab" data-value="hoy">Ir a Hoy</button>
      </div>`;
    return;
  }

  const routine = ROUTINES[state.profile.routine];
  const minPerWeek = Math.max(1, Object.keys(routine.schedule).length - 1);
  const streak = streakWeeks(state.data.workouts, minPerWeek);
  const thisWeek = weekVolume(done, 0);
  const lastWeek = weekVolume(done, 1);
  const delta = lastWeek ? Math.round(((thisWeek - lastWeek) / lastWeek) * 100) : null;

  const withHistory = [...new Set(done.map((s) => s.exercise_id))].filter((id) => EX[id]);
  if (!state.chartExercise || !withHistory.includes(state.chartExercise)) state.chartExercise = withHistory[0];

  const perExercise = withHistory.map((id) => {
    const sets = done.filter((s) => s.exercise_id === id).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    const lastWorkout = sets[0].workout_id;
    const last = bestOf(sets.filter((s) => s.workout_id === lastWorkout));
    const before = bestOf(sets.filter((s) => s.workout_id !== lastWorkout));
    const trend = !before ? 'nuevo' : isBetter(last, before) ? 'sube' : isBetter(before, last) ? 'baja' : 'igual';
    return { id, last, trend, at: new Date(sets[0].created_at) };
  }).sort((a, b) => b.at - a.at);

  root.innerHTML = `${topBar('Tu evolución', 'Progreso')}
    <div class="metrics" style="grid-template-columns:1fr 1fr">
      <div class="metric"><strong>${streak}</strong><span>Semanas seguidas con ${minPerWeek}+ entrenos</span></div>
      <div class="metric"><strong>${fmtKg(thisWeek)}</strong><span>Volumen de la semana (kg)${delta === null ? '' : ` · <span class="${delta >= 0 ? 'trend-up' : 'trend-down'}">${delta >= 0 ? '+' : ''}${delta}%</span>`}</span></div>
    </div>

    <h3 class="group-title">Peso máximo por sesión</h3>
    <select class="field" id="chart-ex" aria-label="Elegir ejercicio del gráfico">
      ${withHistory.map((id) => `<option value="${id}" ${id === state.chartExercise ? 'selected' : ''}>${esc(EX[id].name)}</option>`).join('')}
    </select>
    <div style="margin-top:10px">${chartFor(state.chartExercise)}</div>

    <h3 class="group-title">Por ejercicio</h3>
    <div>${perExercise.map((p) => `<button class="cat-item" data-action="history" data-value="${p.id}">
      <span class="badge" aria-hidden="true">${GROUPS[EX[p.id].group].short}</span>
      <span class="ex-name"><strong>${esc(EX[p.id].name)}</strong><span class="num">${fmtKg(p.last.weight_kg)} kg × ${p.last.reps}</span></span>
      <span class="tag ${p.trend === 'sube' ? 'partial' : p.trend === 'baja' ? 'forbidden' : 'plain'}">${p.trend === 'sube' ? '↑ sube' : p.trend === 'baja' ? '↓ baja' : p.trend === 'igual' ? '= igual' : 'nuevo'}</span>
    </button>`).join('')}</div>`;
}

function renderCatalog() {
  finishHost.innerHTML = '';
  const q = normalize(state.search.trim());
  const knee = state.profile.knee_restriction;
  const items = EXERCISES.filter((e) => !q || normalize(e.name).includes(q) || normalize(GROUPS[e.group].name).includes(q));
  const groups = Object.keys(GROUPS).map((g) => [g, items.filter((e) => e.group === g)]).filter(([, list]) => list.length);
  const list = groups.map(([g, exs]) => `

function openSwap(slot) {
  const routineKey = state.profile.routine;
  const dayKey = state.current ? state.current.workout.day_key : (state.overrideKey || sessionKeyForDay(routineKey, new Date().getDay()));
  const { id, original, swapped } = exerciseAt(routineKey, dayKey, slot);

  openSheet(`<h2>Cambiar ${esc(EX[id].name)}</h2>

function openHistory(exerciseId) {
  const sets = state.data.sets
    .filter((s) => s.exercise_id === exerciseId && s.done)
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const byWorkout = [];
  for (const s of sets) {
    let g = byWorkout.find((x) => x.id === s.workout_id);
    if (!g) { g = { id: s.workout_id, at: new Date(s.created_at), rows: [] }; byWorkout.push(g); }
    g.rows.push(s);
  }
  const best = bestOf(sets);
  const ex = EX[exerciseId];
  openSheet(`<h2>${esc(ex.name)}</h2>
    <p class="muted small">${GROUPS[ex.group].name} · ${EQUIPMENT[ex.equipment]}${best ? ` · récord ${fmtKg(best.weight_kg)} kg × ${best.reps}` : ''}</p>
    ${kneeBand(ex)}
    ${byWorkout.length ? byWorkout.slice(0, 6).map((g) => `<div class="sheet-row" style="display:block;padding:8px 0">
      <strong class="small">${g.at.toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short' })}</strong>
      <div class="muted num small">${g.rows.sort((a, b) => a.set_index - b.set_index).map((r) => `${fmtKg(r.weight_kg)}kg×${r.reps}`).join(' · ')}</div>
    </div>`).join('') : '<p class="muted small">Todavía no lo registraste.</p>'}
    <button class="btn-link" data-action="close-sheet">Cerrar</button>`, 'Historial del ejercicio');
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 4000);
}

// ---- eventos
function findRow(slot, rowId) {
  return (state.current?.sets[slot] || []).find((r) => r.id === rowId);
}

function clearPreview(slot) {
  for (const k of Object.keys(state.previewValues)) if (k.startsWith(`${slot}|`)) delete state.previewValues[k];
}

// Lo que se ve hoy en una fila de la vista previa (lo tocado, o lo de la última vez).
function readPreviewRow(slot, setIndex) {
  const el = document.querySelector(`[data-input="kg"][data-slot="${slot}"][data-row="preview-${setIndex}"]`);
  const reps = document.querySelector(`[data-input="reps"][data-slot="${slot}"][data-row="preview-${setIndex}"]`);
  return { kg: round1(Number(el?.value.replace(',', '.')) || 0), reps: parseInt(reps?.value, 10) || 8 };
}

async function withSave(patch, errorMsg) {
  try {
    await saveProfile(patch);
    return true;
  } catch (err) {
    console.warn(err);
    toast(errorMsg);
    return false;
  }
}

const actions = {
  reload: () => location.reload(),
  signin: signIn,
  signout: signOut,
  tab: (v) => { state.tab = v; state.view = 'main'; closeSheet(); render(); window.scrollTo(0, 0); },
  'ob-name': () => {
    const name = document.getElementById('ob-name').value.trim();
    if (!name) { toast('Escribí un nombre para seguir.'); return; }
    state.onboarding.name = name;
    state.onboarding.step = 2;
    render();
  },
  'ob-routine': (v) => { state.onboarding.routine = v; state.onboarding.step = 3; render(); },
  'ob-back': () => { state.onboarding.step -= 1; render(); },
  'ob-knee': async (v) => {
    const ob = state.onboarding;
    const ok = await withSave(
      { display_name: ob.name, routine: ob.routine, knee_restriction: v === 'true', onboarded: true },
      'No se pudo guardar tu perfil. Revisá la conexión y tocá de nuevo.'
    );
    if (ok) { state.tab = 'hoy'; render(); }
  },
  settings: openSettings,
  'close-sheet': closeSheet,
  'set-routine': async (v) => {
    if (v === state.profile.routine) return;
    if (state.current) { toast('Terminá el entreno en curso antes de cambiar de rutina.'); return; }
    if (await withSave({ routine: v }, 'No se pudo cambiar la rutina. Revisá la conexión y probá de nuevo.')) {
      state.overrideKey = null; render(); openSettings();
    }
  },
  'set-knee': async (v) => {
    const val = v === 'true';
    if (val === state.profile.knee_restriction) return;
    if (await withSave({ knee_restriction: val }, 'No se pudo guardar el cambio. Revisá la conexión y probá de nuevo.')) {
      render(); openSettings();
    }
  },
  'train-anyway': openSessionPicker,
  'pick-session': (v) => { state.overrideKey = v; closeSheet(); render(); window.scrollTo(0, 0); },
  'clear-override': () => { state.overrideKey = null; render(); window.scrollTo(0, 0); },
  'go-slot': (v) => {
    const slot = Number(v);
    if (state.current) state.current.activeSlot = slot;
    else state.previewSlot = slot;
    renderToday();
    window.scrollTo(0, 0);
  },
  'add-set': (slot) => {
    const c = state.current;
    if (!c) { toast('Completá la primera serie para arrancar el entreno.'); return; }
    const exId = exerciseAt(state.profile.routine, c.workout.day_key, Number(slot)).id;
    ensureRows(Number(slot), exId, rowsFor(Number(slot)).length + 1);
    renderToday();
  },
  kg: (dir, el) => {
    const slot = Number(el.dataset.slot);
    const rowId = el.dataset.row;
    // Antes de arrancar el entreno se anota aparte: tocar +/− no crea un entreno.
    if (!state.current) {
      const n = parseInt(String(rowId).replace('preview-', ''), 10) || 1;
      const key = `${slot}|${n}`;
      const cur = state.previewValues[key] || readPreviewRow(slot, n);
      state.previewValues[key] = { kg: Math.max(0, round1((cur.kg || 0) + STEP_KG * Number(dir))), reps: cur.reps };
      renderToday();
      return;
    }
    const row = findRow(slot, rowId);
    if (!row) return;
    row.weight_kg = Math.max(0, round1((Number(row.weight_kg) || 0) + STEP_KG * Number(dir)));
    if (row.done) saveSet(slot, row);
    renderToday();
  },
  'toggle-set': (_, el) => {
    const slot = Number(el.dataset.slot);
    const row = findRow(slot, el.dataset.row) || startAndGetRow(slot, el.dataset.row);
    if (!row) return;
    if (row.done && row.status !== 'error') {
      row.done = false;
      unsaveSet(row);
    } else {
      row.done = true;
      saveSet(slot, row);
      // Las series que siguen arrancan con lo que acabás de levantar.
      for (const r of rowsFor(slot)) {
        if (!r.done && r.set_index > row.set_index) { r.weight_kg = row.weight_kg; r.reps = row.reps; }
      }
      startRest();
    }
    renderToday();
  },
  swap: (slot) => openSwap(Number(slot)),
  'do-swap': async (exerciseId, el) => {
    const slot = Number(el.dataset.slot);
    const routineKey = state.profile.routine;
    const dayKey = state.current ? state.current.workout.day_key : (state.overrideKey || sessionKeyForDay(routineKey, new Date().getDay()));
    state.data.swaps[swapKey(routineKey, dayKey, slot)] = exerciseId;
    clearPreview(slot);
    if (state.current) state.current.sets[slot] = (state.current.sets[slot] || []).filter((r) => r.done);
    closeSheet();
    renderToday();
    try { await db.setSwap(routineKey, dayKey, slot, exerciseId); }
    catch (err) { console.warn(err); toast('El cambio se ve ahora, pero no se pudo guardar. Revisá la conexión.'); }
  },
  'restore-swap': async (slot, el) => {
    const i = Number(slot ?? el.dataset.slot);
    const routineKey = state.profile.routine;
    const dayKey = state.current ? state.current.workout.day_key : (state.overrideKey || sessionKeyForDay(routineKey, new Date().getDay()));
    delete state.data.swaps[swapKey(routineKey, dayKey, i)];
    clearPreview(i);
    if (state.current) state.current.sets[i] = (state.current.sets[i] || []).filter((r) => r.done);
    closeSheet();
    renderToday();
    try { await db.setSwap(routineKey, dayKey, i, null); }
    catch (err) { console.warn(err); toast('El cambio se ve ahora, pero no se pudo guardar. Revisá la conexión.'); }
  },
  'rest-more': () => { state.current.restEndsAt += 15000; renderToday(); },
  'rest-skip': () => { state.current.restEndsAt = null; renderToday(); },
  finish: () => {
    if (!currentSets().length) { toast('Todavía no completaste ninguna serie.'); return; }
    finishWorkout();
  },
  'go-progress': () => { state.view = 'main'; state.tab = 'progreso'; render(); window.scrollTo(0, 0); },
  'go-home': () => { state.view = 'main'; state.tab = 'hoy'; state.overrideKey = null; render(); window.scrollTo(0, 0); },
  history: (v) => openHistory(v),
};

// El entreno se inicia al tocar la primera serie: ahí se crea la fila en workouts.
function startAndGetRow(slot, rowId) {
  if (state.current) return findRow(slot, rowId);
  const routineKey = state.profile.routine;
  const dayKey = state.overrideKey || sessionKeyForDay(routineKey, new Date().getDay());
  const c = startWorkout(routineKey, dayKey);
  c.activeSlot = state.previewSlot ?? slot;
  const exId = exerciseAt(routineKey, dayKey, slot).id;
  const spec = ROUTINES[routineKey].sessions[dayKey].slots[slot][1];
  const rows = ensureRows(slot, exId, targetSets(spec));
  // La fila tocada era de la vista previa: se traduce a la serie real del mismo número.
  const n = parseInt(String(rowId).replace('preview-', ''), 10);
  return rows[Math.min(rows.length, Math.max(1, n || 1)) - 1];
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = actions[el.dataset.action];
  if (fn) fn(el.dataset.value ?? el.dataset.slot, el);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Enter' && e.target.id === 'ob-name') actions['ob-name']();
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'cat-search') { state.search = t.value; renderCatalog(); return; }
  if (t.id === 'chart-ex') { state.chartExercise = t.value; renderProgress(); return; }
  if (t.dataset.input) {
    const slot = Number(t.dataset.slot);
    if (!state.current && String(t.dataset.row).startsWith('preview-')) {
      const n = parseInt(String(t.dataset.row).replace('preview-', ''), 10) || 1;
      state.previewValues[`${slot}|${n}`] = readPreviewRow(slot, n);
      return;
    }
    const row = findRow(slot, t.dataset.row);
    if (!row) return;
    const val = t.value.replace(',', '.');
    if (t.dataset.input === 'kg') row.weight_kg = val === '' ? 0 : Math.max(0, round1(Number(val) || 0));
    else row.reps = val === '' ? null : Math.max(0, parseInt(val, 10) || 0);
    if (row.done) saveSet(slot, row);
  }
});

async function boot() {
  if (DEMO) {
    const p = new URLSearchParams(location.search);
    state.profile = {
      id: 'demo', display_name: 'Daniel Medina', routine: p.get('routine') === 'ppl' ? 'ppl' : 'ul',
      knee_restriction: p.get('knee') !== '0', onboarded: p.get('onboarded') !== '0',
    };
    state.session = { user: { id: 'demo' } };
    if (p.get('reset') === '1') localStorage.removeItem(DEMO_KEY);
    state.data = await db.loadAll();
    render();
    return;
  }
  if (!window.supabase) {
    renderError('No se pudo cargar la app. Revisá la conexión y recargá la página.');
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { flowType: 'pkce', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });
  const params = new URLSearchParams(location.search);
  if (params.has('error_description')) toast('No se pudo entrar con Google: ' + params.get('error_description'));

  const { data } = await sb.auth.getSession();
  if (params.has('code') || params.has('error')) history.replaceState(null, '', location.pathname);
  await onSession(data.session);

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && state.session?.user?.id === session?.user?.id && state.profile) return;
    if (event === 'TOKEN_REFRESHED' || event === 'INITIAL_SESSION') { state.session = session; return; }
    setTimeout(() => onSession(session), 0);
  });
}

(function tests() {
  const ids = EXERCISES.map((e) => e.id);
  console.assert(new Set(ids).size === ids.length, 'catálogo: ids duplicados');
  for (const e of EXERCISES) {
    console.assert(GROUPS[e.group], `catálogo: grupo inválido en ${e.id}`);
    console.assert(EQUIPMENT[e.equipment], `catálogo: equipo inválido en ${e.id}`);
    console.assert(['none', 'partial', 'forbidden'].includes(e.knee), `catálogo: knee inválido en ${e.id}`);
  }
  for (const [rk, r] of Object.entries(ROUTINES)) {
    for (const key of Object.values(r.schedule)) console.assert(r.sessions[key], `${rk}: ${key} sin sesión`);
    for (const [key, s] of Object.entries(r.sessions)) {
      console.assert(key.startsWith(rk + '_'), `${rk}: day_key mal formado ${key}`);
      for (const [id, sets] of s.slots) {
        console.assert(EX[id], `${key}: ejercicio inexistente ${id}`);
        console.assert(/^\d+x\d+(-\d+)?[sm]?$/.test(sets), `${key}: formato de series inválido ${sets}`);
        console.assert(alternativesFor(id, true).length >= 1, `${key}: ${id} sin alternativas aptas para rodilla`);
      }
    }
  }
  for (const g of Object.keys(GROUPS)) {
    console.assert(EXERCISES.filter((e) => e.group === g).length >= 4, `catálogo: menos de 4 opciones en ${g}`);
  }
  console.assert(!alternativesFor('leg_press_45', true).some((e) => e.knee === 'forbidden'), 'swap: aparece un ejercicio prohibido');
  console.assert(!alternativesFor('cable_pull_through', true).some((e) => e.id === 'hip_thrust'), 'swap: hip thrust con restricción');
  console.assert(alternativesFor('cable_pull_through', false).some((e) => e.id === 'hip_thrust'), 'swap: hip thrust sin restricción');
  console.assert(sessionKeyForDay('ul', 2) === 'ul_lowerA' && sessionKeyForDay('ul', 3) === null, 'calendario UL');

  console.assert(targetSets('2x6-10') === 2 && targetSets('8x30s') === 8, 'series objetivo');

  console.assert(volumeOf([{ weight_kg: 60, reps: 9 }, { weight_kg: 62.5, reps: 8 }]) === 1040, 'volumen');

  const b = bestOf([
    { done: true, weight_kg: 60, reps: 9 }, { done: true, weight_kg: 62.5, reps: 8 },
    { done: true, weight_kg: 62.5, reps: 10 }, { done: false, weight_kg: 90, reps: 1 },
  ]);
  console.assert(b.weight_kg === 62.5 && b.reps === 10, 'récord: a igual peso gana más reps');
  console.assert(isBetter({ weight_kg: 62.5, reps: 9 }, { weight_kg: 60, reps: 12 }), 'récord: más peso gana');
  console.assert(!isBetter({ weight_kg: 60, reps: 8 }, { weight_kg: 60, reps: 8 }), 'récord: igualar no es récord');

  const lunes = new Date('2026-09-14T10:00:00');
  console.assert(weekStart(new Date('2026-09-20T23:00:00')).getTime() === weekStart(lunes).getTime(), 'semana: el domingo cierra la semana del lunes');
  const w = (iso) => ({ finished_at: iso, started_at: iso });
  console.assert(streakWeeks([w('2026-09-15T10:00'), w('2026-09-16T10:00'), w('2026-09-17T10:00'),
    w('2026-09-08T10:00'), w('2026-09-09T10:00'), w('2026-09-10T10:00')], 3, new Date('2026-09-18T10:00')) === 2, 'racha de 2 semanas');
  console.assert(streakWeeks([w('2026-09-15T10:00')], 3, new Date('2026-09-18T10:00')) === 0, 'racha cortada');
  console.assert(weekVolume([{ created_at: '2026-09-15T10:00', weight_kg: 50, reps: 10 }], 0, new Date('2026-09-18T10:00')) === 500, 'volumen semanal');
})();
</script>
